name: Validate Registry Data

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate JSON Formatting
        run: |
          echo "Checking plugins.json syntax..."
          cat plugins.json | python3 -m json.tool > /dev/null
          echo "✅ Formatting is completely valid!"
